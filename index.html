<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSSSB TGT CS PYQ Trainer</title>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--card:#fff;--ink:#1c2030;--mute:#6b7285;--line:#e4e7ee;--acc:#4f46e5;--acc2:#eef0ff;--ok:#0f9d6a;--okbg:#e7f7f0;--bad:#d64545;--badbg:#fdeded;--warn:#fff8e6;--fire:#f97316}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
select,input[type=search],input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.chip small{font-weight:400;color:var(--mute)}
.chip.fire{border-color:#fed7aa;background:#fff7ed}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:130px}
.bar{height:7px;border-radius:99px;background:#e9ebf3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.bar.ok>i{background:var(--ok)}
.app{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);background:var(--card);padding:14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.item:hover{background:var(--bg)} .item.on{background:var(--acc);color:#fff}
.item .c{font-size:12px;opacity:.75;white-space:nowrap}
.unit{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 4px}
.mini{height:4px;margin:2px 10px 6px}
main{padding:22px;max-width:940px;width:100%}
h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.theory{background:var(--warn);border:1px solid #f3e5b8;border-radius:12px;padding:12px 18px;margin:12px 0 18px}
.theory summary{cursor:pointer;font-weight:600}
.theory ul{margin:8px 0 0;padding-left:20px}.theory li{margin:5px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.qh{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;margin-bottom:6px;gap:10px}
.star{border:none;background:none;font-size:18px;padding:0 4px;color:#c3c8d4}.star.on{color:#f5b301}
.stem{font-weight:600;white-space:pre-wrap;margin-bottom:10px}
.opt{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--acc);background:var(--acc2)}
.opt b{min-width:20px;color:var(--mute)} .opt span{white-space:pre-wrap}
.q.done .opt{cursor:default}.q.done .opt:hover{background:#fff;border-color:var(--line)}
.opt.right{border-color:var(--ok)!important;background:var(--okbg)!important}
.opt.wrong{border-color:var(--bad)!important;background:var(--badbg)!important}
.sol{display:none;margin-top:10px;padding:10px 13px;border-left:3px solid var(--ok);background:var(--okbg);border-radius:8px;white-space:pre-wrap}
.q.show .sol{display:block}
.relc{display:none;margin-top:8px;padding:9px 13px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:8px;font-size:14px}.q.show .relc{display:block}.q.brief .relc{display:none}
.deep{background:#f3f8ff;border-color:#cfe0fb}
.res{font-weight:700;margin-top:8px}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.tb{border-collapse:collapse;margin:6px 0 12px;font-size:14px}.tb th,.tb td{border:1px solid var(--line);padding:6px 12px;text-align:left}.tb th{background:var(--bg)}
.fig{color:var(--mute);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:28px;font-weight:800}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e9ebf3 0);display:grid;place-items:center;margin:4px auto}
.ring div{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;gap:3px;overflow:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:#eceef5}
.heat i.l1{background:#c7d2fe}.heat i.l2{background:#8b9bf5}.heat i.l3{background:#4f46e5}.heat i.l4{background:#2b24a8}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;opacity:.45;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:#fde68a;background:#fffbeb}
.badge b{display:block;font-size:14px}.badge span{font-size:12px;color:var(--mute)}
.wk{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--mute)}.wk i{display:block;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px;margin-bottom:3px}
.toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{background:#1c2030;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:pop .3s}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.burst{position:fixed;left:50%;top:40%;font-size:60px;pointer-events:none;animation:up 1.4s forwards;z-index:60}
@keyframes up{to{transform:translateY(-120px) scale(1.4);opacity:0}}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.dd{position:relative}
.ddb{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,#fff,#f7f8ff);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,50,.05)}
.ddb:hover,.ddb[aria-expanded=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.ddb .ic{font-size:20px;width:34px;height:34px;display:grid;place-items:center;background:var(--acc2);border-radius:10px;flex:none}
.ddb .tx{flex:1;min-width:0}.ddb .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddb .tx small{color:var(--mute);font-size:12px}
.ddb .chev{color:var(--mute);transition:transform .2s;flex:none}.ddb[aria-expanded=true] .chev{transform:rotate(180deg)}
.ddm{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,24,50,.18);padding:6px;max-height:60vh;overflow:auto}
.ddm[hidden]{display:none}
.ddo{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.ddo:hover,.ddo.hl{background:var(--acc2)}.ddo.sel{background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.ddo .ic{font-size:18px;width:30px;height:30px;display:grid;place-items:center;background:#f2f3f9;border-radius:9px;flex:none}
.ddo .tx{flex:1;min-width:0}.ddo .tx b{display:block;font-size:13.5px;font-weight:600}
.ddo .tx small{color:var(--mute);font-size:11.5px}
.ddo .bar{height:4px;margin-top:5px}
.ddo .pc{font-size:12px;font-weight:700;color:var(--ok);flex:none}
.q.rev .opt{cursor:default}.q.rev .opt:hover{background:#fff;border-color:var(--line)}.q.rev .opt.right:hover{background:var(--okbg)}
.q.brief .exp{display:none}
.tg{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:14px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tg input{display:none}
.tg i{width:34px;height:20px;border-radius:99px;background:#d3d7e4;position:relative;transition:.2s;flex:none}
.tg i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.2s}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i:after{left:16px}
.tg:has(input:checked){border-color:var(--ok);background:var(--okbg)}
.tg.dis{opacity:.45;pointer-events:none}
.q.pyq{border-left:4px solid var(--acc)}.q.prac{border-left:4px solid #0d9488}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;margin-right:6px}
.bdg.pyq{background:var(--acc2);color:var(--acc)}.bdg.prac{background:#ccfbf1;color:#0f766e}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding:10px 14px;border-radius:12px;font-weight:700}
.sec small{font-weight:500;opacity:.8}.sec.pyq{background:var(--acc2);color:var(--acc)}.sec.prac{background:#ccfbf1;color:#0f766e}
.sec .bar{flex:1;max-width:220px;margin-left:auto;background:rgba(255,255,255,.7)}
.sg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sg button{border:none;border-radius:0;padding:8px 14px;font-weight:600}.sg button+button{border-left:1px solid var(--line)}
.sg button.on{background:var(--acc);color:#fff}.sg button.on.p{background:#0d9488}
.sg button span{opacity:.75;font-weight:500;margin-left:5px}
.sb2{display:flex;gap:4px;margin:0 10px 6px}.sb2 .bar{flex:1;height:4px}.sb2 .bar.t i{background:#0d9488}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}
@media print{header,aside,.noprint{display:none}.app{display:block}.sol{display:block!important}.q{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>PYQ Trainer</h1>
  <div class="chip fire" id="hStreak"></div>
  <div class="chip" id="hToday"></div>
  <label class="tg" title="Show all answers to skim and revise"><input type="checkbox" id="hRev" onchange="setRev(this.checked)"><i></i>Revise</label>
  <div class="lvl" id="hLvl"></div>
  <div style="flex:1"></div>
  <button onclick="go({m:'pri'})">🎯 Priority</button><button onclick="go({m:'dash'})">📊 Dashboard</button>
</header>
<div class="app">
<aside>
  <div class="dd" id="dd"><button class="ddb" id="ddb" aria-haspopup="listbox" aria-expanded="false"></button><div class="ddm" id="ddm" role="listbox" hidden></div></div>
  <input id="search" type="search" placeholder="Search questions…" style="margin-top:8px">
  <div class="nav" id="smart"></div>
  <div id="topics"></div>
</aside>
<main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
const dayKey=d=>d.toLocaleDateString('en-CA');
const today=()=>dayKey(new Date());
let S;
try{S=JSON.parse(localStorage.getItem('kgpyq_v1'))}catch(e){}
S=Object.assign({att:{},days:{},bm:{},goal:15,xp:0,badges:{}},S||{});
const save=()=>{try{localStorage.setItem('kgpyq_v1',JSON.stringify(S))}catch(e){}};
let SRC=localStorage.getItem('kgpyq_src')||'all';
let REV=localStorage.getItem('kgpyq_rev')==='1',BRIEF=localStorage.getItem('kgpyq_brief')==='1';
let PRI=null,PT={};
let SUBJ=[],cur=0,V={m:'dash',t:-1,focus:false,i:0,list:null};
const sid=(si,n)=>SUBJ[si].slug+':'+n;
const attemptsToday=()=>(S.days[today()]||{n:0}).n;
const lvlOf=xp=>Math.floor(Math.sqrt(xp/40))+1;
const lvlStart=l=>40*(l-1)**2;

function streak(){let n=0,d=new Date();const met=k=>(S.days[k]?.n||0)>=S.goal;
  if(!met(dayKey(d)))d.setDate(d.getDate()-1);
  while(met(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;}
function bestStreak(){const ks=Object.keys(S.days).filter(k=>S.days[k].n>=S.goal).sort();let b=0,c=0,p=null;
  for(const k of ks){const t=new Date(k+'T00:00:00');c=p&&Math.round((t-p)/864e5)===1?c+1:1;b=Math.max(b,c);p=t}return b;}
function stats(){let a=0,ok=0;for(const k in S.att){a++;if(S.att[k].ok)ok++}return{a,ok};}

const BADGES=[
 ['first','🎯 First Blood','Answer your first question',s=>s.a>=1],
 ['q50','📘 Warming Up','Answer 50 questions',s=>s.a>=50],
 ['q250','📚 Grinder','Answer 250 questions',s=>s.a>=250],
 ['q1000','🏆 Question Machine','Answer 1000 questions',s=>s.a>=1000],
 ['s3','🔥 3-Day Streak','Hit your goal 3 days in a row',()=>bestStreak()>=3],
 ['s7','🔥 Week Warrior','7-day streak',()=>bestStreak()>=7],
 ['s30','🌋 Unstoppable','30-day streak',()=>bestStreak()>=30],
 ['acc','🎓 Sharp Shooter','≥80% accuracy over 50+ answers',s=>s.a>=50&&s.ok/s.a>=.8],
 ['goal','✅ Goal Getter','Complete a daily goal',()=>Object.values(S.days).some(d=>d.n>=S.goal)],
 ['bm','⭐ Curator','Bookmark 5 questions',()=>Object.keys(S.bm).length>=5],
 ['topic','🧩 Topic Master','Finish every question in a topic (5+ questions)',()=>SUBJ.some((s,si)=>s.topics.some(t=>t.qs.length>=5&&t.qs.every(q=>S.att[sid(si,q.n)])))],
 ['subj','👑 Subject Conqueror','Finish every question of a subject',()=>SUBJ.some((s,si)=>s.topics.every(t=>t.qs.every(q=>S.att[sid(si,q.n)])))]
];
function checkBadges(){const st=stats();for(const [id,name,,fn] of BADGES){if(!S.badges[id]&&fn(st)){S.badges[id]=today();toast('Badge unlocked: '+name);burst('🏅')}}}

function toast(t){const d=document.createElement('div');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3500)}
function burst(e){const d=document.createElement('div');d.className='burst';d.textContent=e;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}

function header(){
  const hr=document.getElementById('hRev');if(hr)hr.checked=REV;
  const s=streak(),n=attemptsToday(),l=lvlOf(S.xp),pct=Math.min(100,Math.round((S.xp-lvlStart(l))/(lvlStart(l+1)-lvlStart(l))*100));
  $('#hStreak').innerHTML=`🔥 ${s} <small>day streak</small>`;
  $('#hToday').innerHTML=`🎯 ${n}/${S.goal} <small>today</small>`;
  $('#hLvl').innerHTML=`<div style="font-size:12px"><b>Level ${l}</b> · ${S.xp} XP</div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function allQ(si){return SUBJ[si].topics.flatMap((t,ti)=>t.qs.map(q=>({q,ti,si,id:sid(si,q.n),topic:t.title})))}
const isP=q=>q.src==='Practice';
function listFor(srcOv){const SR=srcOv||SRC;
  let L;
  if(V.m==='topic'){L=V.t<0?allQ(cur):SUBJ[cur].topics[V.t].qs.map(q=>({q,ti:V.t,si:cur,id:sid(cur,q.n),topic:SUBJ[cur].topics[V.t].title}))}
  else{const base=SUBJ.flatMap((_,i)=>allQ(i));
    L=V.m==='bm'?base.filter(x=>S.bm[x.id]):V.m==='miss'?base.filter(x=>S.att[x.id]&&!S.att[x.id].ok):V.m==='new'?allQ(cur).filter(x=>!S.att[x.id]):(V.list||[])}
  if(SR==='pyq')L=L.filter(x=>!isP(x.q));else if(SR==='prac')L=L.filter(x=>isP(x.q));
  const term=$('#search').value.trim().toLowerCase();
  if(term)L=L.filter(x=>(x.q.stem+Object.values(x.q.opts).join(' ')+x.q.sol).toLowerCase().includes(term));
  return L;
}

function sidebar(){
  const st=SUBJ.flatMap((_,i)=>allQ(i));
  const bm=st.filter(x=>S.bm[x.id]).length,miss=st.filter(x=>S.att[x.id]&&!S.att[x.id].ok).length,nw=allQ(cur).filter(x=>!S.att[x.id]).length;
  const it=(m,label,c)=>`<div class="item ${V.m===m?'on':''}" onclick="go({m:'${m}'})"><span>${label}</span><span class="c">${c}</span></div>`;
  $('#smart').innerHTML=it('dash','📊 Dashboard','')+it('pri','🎯 What to study first','')+it('new','🆕 Unattempted (this subject)',nw)+it('miss','❌ My mistakes',miss)+it('bm','⭐ Bookmarked',bm);
  let h='',last='';const sj=SUBJ[cur];
  h+=`<div class="item ${V.m==='topic'&&V.t<0?'on':''}" onclick="go({m:'topic',t:-1})"><span>All topics</span><span class="c">${allQ(cur).filter(x=>S.att[x.id]).length}/${allQ(cur).length}</span></div>`;
  sj.topics.forEach((t,i)=>{
    if(t.unit!==last){h+=`<div class="unit">${esc(t.unit)}</div>`;last=t.unit}
    const A=t.qs.filter(q=>!isP(q)),B=t.qs.filter(isP);const dA=A.filter(q=>S.att[sid(cur,q.n)]).length,dB=B.filter(q=>S.att[sid(cur,q.n)]).length;
    const pA=A.length?dA/A.length*100:0,pB=B.length?dB/B.length*100:0;
    h+=`<div class="item ${V.m==='topic'&&V.t===i?'on':''}" onclick="go({m:'topic',t:${i}})"><span>${prBadge(cur,t.title)}${esc(t.title)}</span><span class="c" title="PYQ done/total · Practice done/total">📄${dA}/${A.length} · ✍️${dB}/${B.length}</span></div><div class="sb2"><div class="bar ok"><i style="width:${pA}%"></i></div><div class="bar t"><i style="width:${pB}%"></i></div></div>`;
  });
  $('#topics').innerHTML=h;
}

const TB={1:['🔥','High priority'],2:['⭐','Medium priority'],3:['·','Lower priority']};
function prBadge(si,title){const p=PT[SUBJ[si].slug+'|'+title];return p?`<span title="${TB[p.tier][1]} · ${p.recent} recent TGT-CS Qs" style="margin-right:5px">${TB[p.tier][0]}</span>`:''}
function priPage(){
  if(!PRI){$('#view').innerHTML='<div class="empty">Priority data not available.</div>';return}
  const prog=(slug)=>{const si=SUBJ.findIndex(s=>s.slug===slug);if(si<0)return{a:0,t:0};const st=subjStat(si);return{a:st.a,t:st.t}};
  const maxS=Math.max(...PRI.subjects.map(s=>s.share));
  const rows=PRI.subjects.map((s,i)=>{const p=prog(s.slug),tg=s.kinds['TGT CS']||0;
    return `<tr style="cursor:pointer" onclick="go({m:'topic',t:-1,si:${SUBJ.findIndex(x=>x.slug===s.slug)}})"><td>${i+1}</td><td>${TB[s.tier][0]} <b>${esc(s.subject)}</b></td><td>${s.n}</td><td>${tg}</td>
    <td style="min-width:140px"><div class="bar"><i style="width:${s.share/maxS*100}%"></i></div><small>${s.share}% of weighted marks-weight</small></td><td>${p.a}/${p.t}</td></tr>`}).join('');
  const phases=[[1,'Phase 1 — Start here (covers ~50% of the weighted exam content)'],[2,'Phase 2 — Next (up to ~80%)'],[3,'Phase 3 — Finish with these']];
  const ph=phases.map(([tier,label])=>{const L=PRI.topics.filter(t=>t.tier===tier);
    return `<h3 style="margin:18px 0 8px">${label}</h3><div class="card">`+L.map(t=>{const si=SUBJ.findIndex(s=>s.slug===t.slug);const ti=si<0?-1:SUBJ[si].topics.findIndex(x=>x.title===t.title);
      const d=ti<0?0:SUBJ[si].topics[ti].qs.filter(q=>S.att[sid(si,q.n)]).length;
      return `<div class="item" onclick="go({m:'topic',t:${ti},si:${si}})"><span>${esc(t.subject.split(' ')[0])} › ${esc(t.title)}</span><span class="c">${t.n} Qs · ${t.recent} recent · ${d}/${t.n} done</span></div>`}).join('')+`</div>`}).join('');
  $('#view').innerHTML=`<h2>🎯 What to study first</h2>
  <p class="sub">Ranked from the questions actually asked in DSSSB papers (TGT CS, PGT CS and TGT Maths), weighted by relevance and recency. Recent TGT Computer Science papers count most.</p>
  <div class="card" style="margin-bottom:14px;font-size:14px"><b>How the score works:</b> each PYQ is worth a weight — <b>TGT CS 2023–25 = 4/3 pts</b>, TGT CS 2021 = 2, PGT CS = 1–1.2, TGT Maths paper = 1.5 (Maths only), other-post papers (e.g. Special Education, Hindi) = 0.6, practice question = 0.25. A topic's score is the sum over its questions; 🔥 = top ~50% of total score, ⭐ = next 30%, rest lower. A topic that keeps coming back in recent TGT papers outranks one that appeared a lot only in old PGT papers.
  <br><br><b>Not included:</b> Section A (GK, reasoning, arithmetic, English, Hindi) — the other 100 marks. Teaching Methodology is included, but its question pool mostly comes from other TGT posts (Special Education, Science, Hindi…), so its rank reflects pedagogy questions common to all TGT papers.</div>
  <div class="card" style="margin-bottom:14px;overflow:auto"><h3>Subjects ranked</h3><table class="tb" style="width:100%"><thead><tr><th>#</th><th>Subject</th><th>PYQs</th><th>TGT-CS Qs</th><th>Weight</th><th>Your progress</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3 style="margin:18px 0 6px">Suggested order of topics</h3><p class="sub">Work top to bottom. Within a phase, finish the 🔥 high-density topics first — they repeat the most.</p>${ph}`;
}
function theoryHtml(s){
  const L=s.split('\n').filter(l=>l.trim());let out='',ul=[],tb=[];
  const fu=()=>{if(ul.length){out+='<ul>'+ul.join('')+'</ul>';ul=[]}};
  const ft=()=>{if(tb.length){const rows=tb.filter(r=>!/^\|[-| ]+\|$/.test(r)).map(r=>r.split('|').slice(1,-1).map(c=>c.trim()));
    out+='<table class="tb"><thead><tr>'+rows[0].map(c=>`<th>${md(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${md(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';tb=[]}};
  for(const l of L){if(l.startsWith('|')){fu();tb.push(l)}else{ft();ul.push(`<li>${md(l.replace(/^- /,''))}</li>`)}}
  fu();ft();return out;
}

function qhtml(x){
  const q=x.q,a=S.att[x.id],t=q.table;
  const rev=REV&&!a;
  const opts=Object.keys(q.opts).map(k=>{let c='';if(a){if(k===q.ans)c='right';else if(k===a.k)c='wrong'}else if(rev&&k===q.ans)c='right'
    return `<div class="opt ${c}" onclick="pick('${x.id}','${k}')"><b>${k}</b><span>${esc(q.opts[k])}</span></div>`}).join('');
  const tbl=t?`<table class="tb"><thead><tr>${t.head.map(c=>`<th colspan="${t.rows[0].length/t.head.length}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
  return `<div class="q ${isP(q)?'prac':'pyq'} ${a?'done show':''}${rev?' rev show':''}${BRIEF?' brief':''}" id="q_${x.id}">
   <div class="qh"><span>${isP(q)?'<span class="bdg prac">✍️ PRACTICE</span>':`<span class="bdg pyq">📄 PYQ · ${esc(q.src||('DSSSB '+q.yr))}</span>`}${esc(SUBJ[x.si].subject)} · ${isP(q)?'P'+(q.n-10000):'Q'+q.n}</span><button class="star ${S.bm[x.id]?'on':''}" title="Bookmark" onclick="bm('${x.id}')">★</button></div>
   <div class="stem">${q.stem?esc(q.stem):'<span class="fig">Figure-based question (figure not captured)</span>'}</div>${tbl}
   ${q.note?`<div class="fig" style="margin-bottom:8px">${esc(q.note)}</div>`:''}
   ${opts}
   ${a?`<div class="res ${a.ok?'ok':'no'}">${a.ok?'✓ Correct':'✗ Wrong — correct answer: '+q.ans}</div>`:rev?'':`<button style="margin-top:6px" onclick="this.closest('.q').classList.toggle('show')">Peek at answer</button>`}
   <div class="sol"><b>Answer: ${q.ans}${q.opts[q.ans]?' — '+esc(q.opts[q.ans]):''}</b><span class="exp"><br>${esc(q.sol)}</span></div>${q.rel?`<div class="relc"><b>🔗 Related concepts</b><br>${md(q.rel)}</div>`:''}</div>`;
}

function findQ(id){const[s,n]=id.split(':');const si=SUBJ.findIndex(x=>x.slug===s);for(const[ti,t]of SUBJ[si].topics.entries())for(const q of t.qs)if(String(q.n)===n)return{q,ti,si,id,topic:t.title}}

function pick(id,k){
  if(REV)return;const x=findQ(id);if(!x||S.att[id])return;
  const ok=k===x.q.ans;S.att[id]={k,ok,t:Date.now()};
  const d=S.days[today()]||(S.days[today()]={n:0,ok:0});d.n++;if(ok)d.ok++;
  const before=lvlOf(S.xp),wasMet=d.n-1>=S.goal;S.xp+=ok?10:2;
  if(lvlOf(S.xp)>before){toast('⬆ Level '+lvlOf(S.xp)+'!');burst('🚀')}
  if(d.n>=S.goal&&!wasMet){toast('🎯 Daily goal reached — streak '+streak()+' 🔥');burst('🔥')}
  checkBadges();save();header();sidebar();
  const el=document.getElementById('q_'+id);if(el)el.outerHTML=qhtml(x);
  document.getElementById('nextBtn')?.focus();
}
function bm(id){if(S.bm[id])delete S.bm[id];else S.bm[id]=1;save();const x=findQ(id),el=document.getElementById('q_'+id);
  if(el){const o=el.classList.contains('show');el.outerHTML=qhtml(x);if(o)document.getElementById('q_'+id).classList.add('show')}sidebar();checkBadges();}

function go(o){V=Object.assign({m:'dash',t:-1,focus:false,i:0,list:null},o);if(o.si!==undefined){cur=o.si}render();window.scrollTo(0,0)}
function startPractice(n,src){const base=listFor(src);const L=base.filter(x=>!S.att[x.id]);const pool=(L.length?L:base).slice().sort(()=>Math.random()-.5).slice(0,n);
  V.list=pool;V.m='prac';V.focus=true;V.i=0;render();window.scrollTo(0,0)}
function render(){
  header();sidebar();ddRender();
  if(V.m==='dash')return dash();
  if(V.m==='pri')return priPage();
  const cAll=listFor('all').length,cP=listFor('pyq').length,cR=listFor('prac').length;
  const L0=listFor();const L=L0.slice().sort((a,b)=>(isP(a.q)?1:0)-(isP(b.q)?1:0));const t=V.m==='topic'&&V.t>=0?SUBJ[cur].topics[V.t]:null;
  const title={topic:t?t.title:SUBJ[cur].subject+' — all topics',bm:'⭐ Bookmarked',miss:'❌ My mistakes',new:'🆕 Unattempted in '+SUBJ[cur].subject,prac:'🎲 Practice set'}[V.m];
  const done=L.filter(x=>S.att[x.id]).length,ok=L.filter(x=>S.att[x.id]?.ok).length;
  let h=`<h2>${esc(title)}</h2><p class="sub">${L.length} questions · ${done} attempted${done?` · ${Math.round(ok/done*100)}% correct`:''}</p>
  <div class="row noprint" style="margin-bottom:14px">
    <button class="pri" onclick="startPractice(10)">▶ 10 random</button><button onclick="startPractice(10,'pyq')">📄 10 random PYQ</button><button style="border-color:#0d9488;color:#0f766e" onclick="startPractice(10,'prac')">✍️ 10 random practice</button>
    <button onclick="V.focus=!V.focus;V.i=0;render()">${V.focus?'📃 Show full list':'🔍 One at a time'}</button>
    <button onclick="window.print()">🖨 Print / PDF</button>
  </div>
  <div class="row noprint" style="margin-bottom:12px">
    <div class="sg">${[['all','All',cAll,''],['pyq','📄 Past papers',cP,''],['prac','✍️ Practice',cR,'p']].map(([k,l,c,cls])=>`<button class="${SRC===k?'on '+cls:''}" onclick="setSrc('${k}')">${l}<span>${c}</span></button>`).join('')}</div>
  </div>
  <div class="row noprint" style="margin-bottom:14px">
    <label class="tg"><input type="checkbox" ${REV?'checked':''} onchange="setRev(this.checked)"><i></i>Revision mode — show all answers</label>
    <label class="tg ${REV?'':'dis'}"><input type="checkbox" ${BRIEF?'checked':''} onchange="setBrief(this.checked)"><i></i>Answers only (hide explanations)</label>
  </div>`;
  if(t)h+=`<details class="theory" ${V.focus?'':'open'}><summary>Must-know theory</summary>${theoryHtml(t.theory)}</details>`+(t.deep?`<details class="theory deep"><summary>📚 Deep revision notes — concepts beyond the PYQs</summary>${theoryHtml(t.deep)}</details>`:'');
  if(!L.length)h+=`<div class="empty">Nothing here yet.</div>`;
  else if(V.focus){V.i=Math.min(V.i,L.length-1);const x=L[V.i];
    h+=`<div class="bar" style="margin-bottom:10px"><i style="width:${Math.round((V.i+1)/L.length*100)}%"></i></div><div class="sub">Question ${V.i+1} of ${L.length} · keys: A–D answer, ← → move</div>`+qhtml(x)+
    `<div class="row"><button ${V.i?'':'disabled'} onclick="V.i--;render()">← Prev</button><button id="nextBtn" class="pri" ${V.i<L.length-1?'':'disabled'} onclick="V.i++;render();window.scrollTo(0,0)">Next →</button></div>`}
  else{const sec=(cls,label,arr)=>{if(!arr.length)return '';const d=arr.filter(x=>S.att[x.id]).length;return `<div class="sec ${cls}">${label}<small>${d}/${arr.length} done</small><div class="bar"><i style="width:${arr.length?d/arr.length*100:0}%"></i></div></div>`+arr.map(qhtml).join('')};
    const A=L.filter(x=>!isP(x.q)),B=L.filter(x=>isP(x.q));
    h+=sec('pyq','📄 Past-paper questions (PYQ)',A)+sec('prac','✍️ Practice questions',B);}
  $('#view').innerHTML=h;
}

function dash(){
  const st=stats(),s=streak(),n=attemptsToday(),pct=Math.min(100,Math.round(n/S.goal*100));
  const tot=SUBJ.reduce((a,_,i)=>a+allQ(i).length,0);
  const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return{l:d.toLocaleDateString('en',{weekday:'short'}),n:S.days[dayKey(d)]?.n||0}});
  const mx=Math.max(S.goal,...wk.map(w=>w.n));
  const heat=[...Array(105)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(104-i));const c=S.days[dayKey(d)]?.n||0;const r=c/S.goal;
    return `<i class="${c?r>=1.5?'l4':r>=1?'l3':r>=.5?'l2':'l1':''}" title="${dayKey(d)}: ${c} questions"></i>`}).join('');
  const subj=SUBJ.map((sj,i)=>{const L=allQ(i);const a=L.filter(x=>S.att[x.id]);const ok=a.filter(x=>S.att[x.id].ok).length;
    return `<div class="item" onclick="go({m:'topic',t:-1,si:${i}})"><span>${esc(sj.subject)}</span><span class="c">📄${L.filter(x=>!isP(x.q)&&S.att[x.id]).length}/${L.filter(x=>!isP(x.q)).length} · ✍️${L.filter(x=>isP(x.q)&&S.att[x.id]).length}/${L.filter(x=>isP(x.q)).length}${a.length?` · ${Math.round(ok/a.length*100)}%`:''}</span></div><div class="bar mini ok"><i style="width:${L.length?a.length/L.length*100:0}%"></i></div>`}).join('');
  const weak=SUBJ.flatMap((sj,si)=>sj.topics.map((t,ti)=>{const a=t.qs.filter(q=>S.att[sid(si,q.n)]);return{si,ti,t:sj.subject+' › '+t.title,n:a.length,acc:a.length?a.filter(q=>S.att[sid(si,q.n)].ok).length/a.length:1}})).filter(w=>w.n>=3&&w.acc<.7).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const bd=BADGES.map(([id,name,desc])=>`<div class="badge ${S.badges[id]?'on':''}"><b>${name}</b><span>${desc}</span></div>`).join('');
  $('#view').innerHTML=`<h2>Your progress</h2><p class="sub">Small steps daily beat big pushes. Hit your goal to keep the streak alive.</p>
  <div class="grid">
   <div class="card"><h3>Today's goal</h3><div class="ring" style="--p:${pct}"><div>${n}/${S.goal}</div></div>
     <div class="row" style="justify-content:center;margin-top:6px;font-size:13px">Goal <input type="number" min="1" max="200" value="${S.goal}" style="width:70px" onchange="S.goal=Math.max(1,+this.value||15);save();render()"> /day</div></div>
   <div class="card"><h3>Streak</h3><div class="big">🔥 ${s}</div><div class="sub">Best: ${bestStreak()} days</div></div>
   <div class="card"><h3>Level</h3><div class="big">${lvlOf(S.xp)}</div><div class="sub">${S.xp} XP · +10 correct, +2 for trying</div></div>
   <div class="card"><h3>Accuracy</h3><div class="big">${st.a?Math.round(st.ok/st.a*100):0}%</div><div class="sub">${st.ok} of ${st.a} · ${tot-st.a} left of ${tot}</div></div>
  </div>
  <div class="row noprint" style="margin-bottom:14px"><button class="pri" onclick="startPractice10()">▶ Start today's 10</button><button onclick="go({m:'miss'})">❌ Review mistakes</button></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
   <div class="card"><h3>Last 7 days</h3><div class="wk">${wk.map(w=>`<div><i style="height:${Math.round(w.n/mx*60)}px;${w.n>=S.goal?'background:var(--ok)':''}"></i>${w.n}<br>${w.l}</div>`).join('')}</div></div>
   <div class="card"><h3>Weak topics (&lt;70%)</h3>${weak.length?weak.map(w=>`<div class="item" onclick="go({m:'topic',t:${w.ti},si:${w.si}})"><span>${esc(w.t)}</span><span class="c">${Math.round(w.acc*100)}%</span></div>`).join(''):'<div class="sub">Nothing yet — answer 3+ questions in a topic.</div>'}</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Last 15 weeks</h3><div class="heat">${heat}</div></div>
  <div class="card" style="margin-bottom:14px"><h3>Subjects</h3>${subj}</div>
  <h3 style="margin:18px 0 8px">Badges</h3><div class="badges">${bd}</div>
  <div class="row noprint" style="margin-top:22px"><button onclick="exportP()">⬇ Export progress</button><button onclick="document.getElementById('imp').click()">⬆ Import</button><input id="imp" type="file" accept=".json" hidden onchange="importP(this.files[0])"><button onclick="if(confirm('Reset ALL progress?')){S={att:{},days:{},bm:{},goal:15,xp:0,badges:{}};save();render()}">Reset</button></div>`;
}
function setSrc(k){SRC=k;try{localStorage.setItem('kgpyq_src',k)}catch(e){}render()}
function setRev(v){REV=v;try{localStorage.setItem('kgpyq_rev',v?'1':'0')}catch(e){}render()}
function setBrief(v){BRIEF=v;try{localStorage.setItem('kgpyq_brief',v?'1':'0')}catch(e){}render()}
function startPractice10(){V.m='new';startPractice(10)}
function exportP(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='pyq-progress.json';a.click()}
function importP(f){const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();toast('Progress imported')}catch(e){toast('Invalid file')}};r.readAsText(f)}

document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||!V.focus)return;
  const L=listFor();
  if(e.key==='ArrowRight'&&V.i<L.length-1){V.i++;render()}
  else if(e.key==='ArrowLeft'&&V.i>0){V.i--;render()}
  else{const k=e.key.toUpperCase();if(k.length===1&&'ABCD'.includes(k)){const x=L[V.i];if(x&&x.q.opts[k])pick(x.id,k)}}
});


const ICONS={'Computer Networks':'🌐','Design & Analysis of Algorithms':'🧮','Emerging Trends':'🤖','Computer Graphics & Multimedia':'🎨','Python':'🐍','Software Engineering':'🛠️','Internet & Web Technologies':'🕸️','Digital Electronics':'🔌','Operating Systems & Linux':'🐧','Database Management System':'🗄️','Computer Fundamentals & Architecture':'💻','Mathematics':'📐','Programming, DS & Java':'☕'};
const icon=n=>ICONS[n]||'📘';
function subjStat(i){const L=allQ(i),a=L.filter(x=>S.att[x.id]);return{t:L.length,a:a.length,ok:a.filter(x=>S.att[x.id].ok).length,py:L.filter(x=>!isP(x.q)).length,pr:L.filter(x=>isP(x.q)).length}}
function ddRender(){
  const sj=SUBJ[cur],st=subjStat(cur);
  $('#ddb').innerHTML=`<span class="ic">${icon(sj.subject)}</span><span class="tx"><b>${esc(sj.subject)}</b><small>${st.a}/${st.t} done${st.a?` · ${Math.round(st.ok/st.a*100)}% correct`:''}</small></span><svg class="chev" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>`;
  $('#ddm').innerHTML=SUBJ.map((s,i)=>{const t=subjStat(i);const p=t.t?Math.round(t.a/t.t*100):0;
    return `<div class="ddo ${i===cur?'sel':''}" role="option" data-i="${i}"><span class="ic">${icon(s.subject)}</span><span class="tx"><b>${esc(s.subject)}</b><small>📄 ${t.py} PYQ · ✍️ ${t.pr} practice · ${t.a} done</small><div class="bar ok"><i style="width:${p}%"></i></div></span><span class="pc">${p}%</span></div>`}).join('');
}
function ddOpen(o){const m=$('#ddm');m.hidden=!o;$('#ddb').setAttribute('aria-expanded',o);if(o){ddRender();m.querySelector('.sel')?.scrollIntoView({block:'nearest'})}}
$('#ddb').onclick=e=>{e.stopPropagation();ddOpen($('#ddm').hidden)};
$('#ddm').onclick=e=>{const o=e.target.closest('.ddo');if(!o)return;ddOpen(false);go({m:'topic',t:-1,si:+o.dataset.i})};
document.addEventListener('click',e=>{if(!e.target.closest('#dd'))ddOpen(false)});
document.addEventListener('keydown',e=>{const m=$('#ddm');if(m.hidden){return}
  const os=[...m.querySelectorAll('.ddo')];let i=os.findIndex(x=>x.classList.contains('hl'));if(i<0)i=cur;
  if(e.key==='Escape'){ddOpen(false);$('#ddb').focus()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();i=(i+(e.key==='ArrowDown'?1:-1)+os.length)%os.length;os.forEach(x=>x.classList.remove('hl'));os[i].classList.add('hl');os[i].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();const o=os[i];ddOpen(false);go({m:'topic',t:-1,si:+o.dataset.i})}
},true);
async function load(){
  const idx=await (await fetch('data/index.json',{cache:'no-store'})).json();
  try{PRI=await (await fetch('data/priority.json',{cache:'no-store'})).json();PRI.topics.forEach(t=>PT[t.slug+'|'+t.title]=t)}catch(e){}
  SUBJ=[];for(const f of idx){const d=await (await fetch('data/'+f,{cache:'no-store'})).json();d.slug=f.replace('.json','');SUBJ.push(d)}
  render();
}
$('#search').oninput=()=>{if(V.m==='dash')V.m='topic';render()};
load();
</script>
</body>
</html>
